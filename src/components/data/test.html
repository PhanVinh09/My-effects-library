<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .text-gradient {
      font-size: 40px;
      font-weight: bold;
      color: white;
      background: linear-gradient(30deg, red, blue, violet, white, violet, blue , red);
      background-size: 1000% 1000%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: animateGradient 8s ease infinite;
    }
    @keyframes animateGradient {
      0%{
        background-position: 0% 50%;
      }
      50%{
        background-position: 100% 50%;
      }
      100%{
        background-position: 0% 50%;
      }
      
    }

  </style>
</head>

<body>
  <div class="text-gradient">Animation Gradient Text</div>
</body>

</html>
