<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Styled Table</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f7fa;
      padding: 40px 20px;
    }

    .table-container {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
    }

    .table-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .btn-add {
      padding: 8px 16px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.3s;
    }

    .btn-add:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      background-color: #007BFF;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #eaf3ff;
      transition: 0.3s;
    }

    .action-btn {
      padding: 6px 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
      margin-right: 5px;
    }

    .action-btn:hover {
      background-color: #218838;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: #fff;
      margin: 10px auto;
      padding: 20px 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.3s ease-in-out;
    }

    .close-btn {
      float: right;
      font-size: 24px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #000;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    @media (max-width: 768px) {

      th,
      td {
        padding: 10px 8px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <div class="table-container">
    <div class="table-header">
      <a class="btn-add" href="#">Thêm hiệu ứng</a>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Author</th>
          <th>Effect Name</th>
          <th>Type</th>
          <th>Link</th>
          <th>HTML</th>
          <th>CSS</th>
          <th>JSS</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>001</td>
          <td>John Doe</td>
          <td>Fade In</td>
          <td>Animation</td>
          <td><a href="#">View</a></td>
          <td>Yes</td>
          <td>Yes</td>
          <td>Yes</td>
          <td>
            <button class="action-btn btn-delete">Delete</button>
            <button class="action-btn btn-edit">Edit</button>
          </td>
        </tr>
        <tr>
          <td>002</td>
          <td>Jane Smith</td>
          <td>Slide Up</td>
          <td>Scroll</td>
          <td><a href="#">View</a></td>
          <td>Yes</td>
          <td>Yes</td>
          <td>No</td>
          <td>
            <button class="action-btn btn-delete">Delete</button>
            <button class="action-btn btn-edit">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" data-close="addModal">&times;</span>
      <h2>Thêm hiệu ứng mới</h2>
      <form>
        <label>Author</label>
        <input type="text" placeholder="Tên người làm..." />
        <label>Effect Name</label>
        <input type="text" placeholder="Tên hiệu ứng..." />
        <label>Type</label>
        <input type="text" placeholder="Loại hiệu ứng..." />
        <label>Link</label>
        <input type="text" placeholder="Link CDN(nếu có)" />
        <label>HTML</label>
        <input type="text" placeholder="HTML..." />
        <label>CSS</label>
        <input type="text" placeholder="CSS..." />
        <label>JS</label>
        <input type="text" placeholder="JS..." />
        <button type="submit" class="action-btn">Lưu</button>
      </form>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" data-close="editModal">&times;</span>
      <h2>Sửa hiệu ứng</h2>
      <form id="editForm">
        <label>Author</label>
        <input type="text" name="author" />
        <label>Effect Name</label>
        <input type="text" name="effect" />
        <label>Type</label>
        <input type="text" name="type" />
        <label>Link</label>
        <input type="text" name="link" />
        <label>HTML</label>
        <input type="text" name="html" />
        <label>CSS</label>
        <input type="text" name="css" />
        <label>JS</label>
        <input type="text" name="js" />
        <button type="submit" class="action-btn">Lưu</button>
      </form>
    </div>
  </div>

  <script>
    // Mở modal Thêm
    const addModal = document.getElementById("addModal");
    document.querySelector(".btn-add").addEventListener("click", function (e) {
      e.preventDefault();
      addModal.style.display = "block";
    });

    // Mở modal Sửa
    const editModal = document.getElementById("editModal");
    const editForm = document.getElementById("editForm");

    document.querySelectorAll(".btn-edit").forEach((btn) => {
      btn.addEventListener("click", function () {
        const row = this.closest("tr");
        const cells = row.querySelectorAll("td");

        // Lấy dữ liệu từ dòng được chọn
        editForm.author.value = cells[1].innerText;
        editForm.effect.value = cells[2].innerText;
        editForm.type.value = cells[3].innerText;
        editForm.link.value = cells[4].innerText;
        editForm.html.value = cells[5].innerText;
        editForm.css.value = cells[6].innerText;
        editForm.js.value = cells[7].innerText;

        // Hiển thị modal sửa
        editModal.style.display = "block";
      });
    });

    // Đóng modal khi bấm nút X
    document.querySelectorAll(".close-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-close");
        document.getElementById(targetId).style.display = "none";
      });
    });

    // Đóng khi bấm ra ngoài
    window.addEventListener("click", function (e) {
      if (e.target.classList.contains("modal")) {
        e.target.style.display = "none";
      }
    });
  </script>
</body>

</html>
