<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Text Animation</title>
  <style>
    .text {
      position: relative;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
      
    }
    .text:hover{
      color: white;
      text-shadow: 2px 2px 5px violet;
    }
  </style>
</head>

<body>
  <span class="text">Hover Me</span>
</body>

</html>
